<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>R56 doc</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Tells the browser where Three.js comes from -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="js/background3d.js"></script>
    <script type="module" src="js/setup.js"></script>
    <script defer src="js/pixel-background.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Handlee&family=Knewave&family=Lobster&display=swap" rel="stylesheet">
</head>


<body>
    <canvas id="pixelBackground" aria-hidden="true"></canvas>
    <!-- 3D model area on the right -->
     
    <div id="modelBackground">
        <canvas id="miniCanvas"></canvas>
    </div>

    <!-- Main page content -->
    <main id="pageLayout">
        <!-- Left column -->
        <section id="leftPanel">
            <!-- Purple box -->
            <div class="r56doc-logo">
                <span class="r56-text">R56</span>
                <span class="doc-text">doc</span>
            </div>

            <!-- Blue box -->
            <div id="infoCard">
                <h2>Getting Started is easy as...</h2>
                <p> 1. Pair your Bluetooth OBD adapter with your device first.</p>
                <p> 2. Choose where your session logs should be saved.</p>
                <p> 3. Once connected, I will create a new log file automatically.</p>
            </div>

            <!-- Green + Yellow row -->
            <div id="bottomControls">
                <div id="actionRow">
                    <button id="folderBox" type="button">
                        <span class="label">Log folder</span>
                        <span id="folderStatus">No log folder selected</span>
                    </button>

                    <button id="connectButton" type="button">
                        Connect
                    </button>
                </div>

                <div id="status">
                    Not connected
                </div>
            </div>
        </section>
    </main>
</body>
</html>
