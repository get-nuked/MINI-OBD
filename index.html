<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MINI OBD Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 60px auto;
            padding: 20px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }

        #output {
            margin-top: 20px;
            padding: 20px;
            background: #111;
            color: #eee;
            min-height: 150px;
            white-space: pre-wrap;
            font-family: monospace;
        }
    </style>
</head>

<body>

    <h1>MINI OBD Test</h1>

    <button id="connectButton">
        Connect to OBD Adapter
    </button>

    <div id="status">
        Not connected
    </div>

    <div id="output"></div>

    <script>

        const connectButton = document.getElementById("connectButton");
        const status = document.getElementById("status");
        const output = document.getElementById("output");

        let port;

        connectButton.addEventListener("click", async () => {

            try {

                if (!("serial" in navigator)) {
                    throw new Error(
                        "Web Serial is not supported by this browser."
                    );
                }

                status.textContent = "Choose your OBD adapter...";

                port = await navigator.serial.requestPort();

                await port.open({
                    baudRate: 38400
                });

                status.textContent = "Connected";

                output.textContent +=
                    "Connected to serial device\n";

                const writer = port.writable.getWriter();

                const encoder = new TextEncoder();

                await writer.write(
                    // encoder.encode("ATI\r")
                    encoder.encode("ATRV\r")
                );

                writer.releaseLock();

                output.textContent +=
                    "Sent: ATRV\n\n";

                const reader = port.readable.getReader();

                const decoder = new TextDecoder();

                let response = "";

                while (true) {

                    const { value, done } =
                        await reader.read();

                    if (done) {
                        break;
                    }

                    response += decoder.decode(value);

                    output.textContent = response;

                    if (response.includes(">")) {
                        break;
                    }
                }

                reader.releaseLock();

            } catch (error) {

                console.error(error);

                status.textContent =
                    "Connection failed";

                output.textContent +=
                    "\nERROR: " + error.message;
            }

        });

    </script>

</body>
</html>
