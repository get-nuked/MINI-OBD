<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MINI OBD Test</title>

    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>MINI OBD Test</h1>

    <button id="connectButton">
        Connect to OBD Adapter
    </button>

    <div id="status">
        Not connected
    </div>

    <div id="output"></div>

    <div id="commandArea">
        <input id="commandInput" type="text" placeholder="Enter command e.g. ATI" disabled>
        <button id="sendButton" disabled> Send </button>
    </div>
</body>
</html>
