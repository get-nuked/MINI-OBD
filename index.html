<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MINI OBD Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 60px auto;
            padding: 20px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }

        #commandArea {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        #commandInput {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-family: monospace;
        }

        #output {
            margin-top: 20px;
            padding: 20px;
            background: #111;
            color: #eee;
            min-height: 200px;
            /* Keeps line breaks from the OBD response */
            white-space: pre-wrap;
            font-family: monospace;
        }
    </style>
</head>

<body>
    <h1>MINI OBD Test</h1>

    <button id="connectButton">
        Connect to OBD Adapter
    </button>

    <div id="status">
        Not connected
    </div>

    <div id="output"></div>

    <div id="commandArea">
        <input id="commandInput" type="text" placeholder="Enter command e.g. ATI" disabled>
        <button id="sendButton" disabled> Send </button>
    </div>

    <script>
        const connectButton = document.getElementById("connectButton")
        const sendButton = document.getElementById("sendButton")
        const commandInput = document.getElementById("commandInput")
        const status = document.getElementById("status")
        const output = document.getElementById("output")

        let port

        connectButton.addEventListener("click", async () => {
            try { // Check that the browser supports Web Serial
                if (!("serial" in navigator)) {
                    throw new Error(
                        "Web Serial is not supported by this browser."
                    )
                }

                status.textContent = "Choose your OBD adapter..."

                // Opens the browser's serial/Bluetooth device picker
                port = await navigator.serial.requestPort()

                // Opens the serial connection to the adapter
                await port.open({
                    baudRate: 38400
                })

                status.textContent = "Connected"
                output.textContent += "Connected to OBD adapter\n\n"

                commandInput.disabled = false
                sendButton.disabled = false

                commandInput.focus()
            } catch (error) {
                console.error(error)
                status.textContent = "Connection failed"
                output.textContent += "\nERROR: " + error.message
            }
        })


        async function sendCommand(command) {
            if (!port) {
                return
            }
            command = command.trim().toUpperCase()

            if (command === "") {
                return
            }

            try {
                output.textContent += "> " + command + "\n"

                // Get access to send data to the adapter
                const writer = port.writable.getWriter()
                const encoder = new TextEncoder()

                // ELM commands end with a carriage return
                await writer.write(
                    encoder.encode(command + "\r")
                )

                writer.releaseLock()

                // Read the adapter's response
                const reader = port.readable.getReader()
                const decoder = new TextDecoder()

                let response = ""

                while (true) {
                    const { value, done } =
                        await reader.read()

                    if (done) {
                        break
                    }

                    response += decoder.decode(value)

                    // ">" means the ELM327 is ready for another command
                    if (response.includes(">")) {
                        break
                    }
                }

                reader.releaseLock()
                output.textContent += response + "\n"
                // Scroll to the latest response
                output.scrollTop = output.scrollHeight
            } catch (error) {
                console.error(error)
                output.textContent += "ERROR: " + error.message + "\n"
            }
        }


        sendButton.addEventListener("click", async () => {
            const command = commandInput.value
            commandInput.value = ""
            await sendCommand(command)
            commandInput.focus()
        })


        // Pressing Enter also sends the command
        commandInput.addEventListener("keydown", async (event) => {
            if (event.key === "Enter") {
                const command = commandInput.value
                commandInput.value = ""
                await sendCommand(command)
                commandInput.focus()
            }
        })
    </script>
</body>
</html>
